<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ExpatBase — správa partnerov</title>
<style>
  :root{
    --blue:#1A4F8A;--blue-dark:#0F3360;--blue-light:#E8F1FB;
    --green:#2E9E6B;--green-dark:#1D7A50;--green-light:#E6F7EF;
    --gray-50:#F4F6F9;--gray-100:#DDE3EC;--gray-400:#8C97A8;--gray-700:#3D4A5C;--gray-900:#1F2937;
    --amber-light:#FEF6E7;--amber-text:#7c4a03;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--gray-50);color:var(--gray-900);line-height:1.6}
  .nav{background:#fff;border-bottom:1px solid var(--gray-100);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;color:var(--blue-dark);text-decoration:none}
  .logo .eb{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
  .nav .tag{font-size:12px;color:var(--gray-400)}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 70px}
  h1{font-size:23px;font-weight:800;color:var(--blue-dark);margin-bottom:5px}
  .sub{color:var(--gray-700);font-size:14px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--gray-100);border-radius:16px;padding:20px;margin-bottom:18px}
  .card h2{font-size:14px;font-weight:700;color:var(--blue-dark);margin-bottom:10px}
  label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
  input[type=password],input[type=text]{width:100%;padding:11px 13px;border:1.5px solid var(--gray-100);border-radius:11px;font-size:14px;font-family:inherit;color:var(--gray-900);background:#fff}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,79,138,.12)}
  .hint{font-size:12px;color:var(--gray-400);margin-top:6px}
  .btn{border:none;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:10px 20px;background:var(--green);color:#fff;transition:background .15s,opacity .15s}
  .btn:hover{background:var(--green-dark)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--gray-100)}
  .btn.ghost:hover{background:var(--blue-light)}
  .btn.sm{padding:8px 15px;font-size:13px}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row > div{flex:1 1 280px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-400);padding:0 12px 10px;font-weight:700;white-space:nowrap}
  td{padding:13px 12px;border-top:1px solid var(--gray-100);font-size:14px;vertical-align:middle}
  td .nm{font-weight:700;color:var(--blue-dark)}
  td .meta{font-size:12px;color:var(--gray-400)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill.sent{background:var(--green-light);color:var(--green-dark)}
  .pill.not{background:var(--amber-light);color:var(--amber-text)}
  .msg{font-size:13px;margin-top:18px;padding:12px 14px;border-radius:11px;display:none}
  .msg.ok{display:block;background:var(--green-light);color:var(--green-dark)}
  .msg.err{display:block;background:#FDECEC;color:#b91c1c}
  .rowmsg{font-size:12px;margin-top:4px}
  .rowmsg.ok{color:var(--green-dark)}
  .rowmsg.err{color:#b91c1c}
  .empty{text-align:center;color:var(--gray-400);padding:34px 0;font-size:14px}
  @media(max-width:720px){
    thead{display:none}
    tr{display:block;border-top:1px solid var(--gray-100);padding:12px 0}
    td{display:block;border:none;padding:3px 0}
  }
</style>
</head>
<body>

<div class="nav">
  <a class="logo" href="index.html"><span class="eb">EB</span>ExpatBase</a>
  <span class="tag">Interná stránka · neindexuje sa</span>
</div>

<div class="wrap">
  <h1>Správa partnerov</h1>
  <p class="sub">Zoznam schválených firiem. Tlačidlom pošleš firme uvítací e-mail s odkazom na jej profil a návodom, ako sa prihlási.</p>

  <div class="card">
    <h2>Prístupový kľúč</h2>
    <div class="row">
      <div>
        <label for="tok">ADMIN_TOKEN</label>
        <input type="password" id="tok" autocomplete="off" placeholder="vlož kľúč z Cloudflare">
      </div>
      <button class="btn ghost" id="saveTok">Zapamätať</button>
    </div>
    <div class="hint">Uloží sa len v tomto prehliadači. Bez neho sa e-maily poslať nedajú.</div>
  </div>

  <div class="card">
    <h2>Schválené firmy (<span id="cnt">…</span>)</h2>
    <div id="tblWrap"><p class="empty">Načítavam…</p></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
(function(){
  var SB_URL = 'https://etxqrlrqbjcbjmitnspv.supabase.co';
  var SB_KEY = 'sb_publishable_i38f7jyt2HYOjUTNuOsklg_aMofdDvE';
  var SENT_KEY = 'eb_welcome_sent';

  var $ = function(id){ return document.getElementById(id); };
  function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function sentSet(){
    try { return JSON.parse(localStorage.getItem(SENT_KEY) || '[]'); } catch(e){ return []; }
  }
  function markSent(id){
    try { var a = sentSet(); if (a.indexOf(id) === -1) { a.push(id); localStorage.setItem(SENT_KEY, JSON.stringify(a)); } } catch(e){}
  }

  try { $('tok').value = localStorage.getItem('eb_admin_token') || ''; } catch(e){}
  $('saveTok').addEventListener('click', function(){
    try { localStorage.setItem('eb_admin_token', $('tok').value.trim()); } catch(e){}
    show('ok', 'Kľúč uložený v tomto prehliadači.');
  });

  function show(kind, text){
    var m = $('msg'); m.className = 'msg ' + kind; m.textContent = text;
  }

  function fmtDate(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('sk-SK', { day:'numeric', month:'numeric', year:'numeric' }) + ' ' +
             d.toLocaleTimeString('sk-SK', { hour:'2-digit', minute:'2-digit' });
    } catch(e){ return ''; }
  }

  function load(){
    fetch(SB_URL + '/rest/v1/businesses?select=id,name,contact_name,email,category,created_at,status&order=created_at.desc', {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if (!Array.isArray(rows)) throw new Error('Neočakávaná odpoveď z databázy.');
      $('cnt').textContent = rows.length;
      if (!rows.length) { $('tblWrap').innerHTML = '<p class="empty">Zatiaľ žiadne schválené firmy.</p>'; return; }
      var sent = sentSet();
      var html = '<table><thead><tr><th>Firma</th><th>Kontakt</th><th>Registrácia</th><th>Uvítací e-mail</th><th></th></tr></thead><tbody>';
      rows.forEach(function(b){
        var done = sent.indexOf(b.id) !== -1;
        html += '<tr data-id="' + esc(b.id) + '">' +
          '<td><span class="nm">' + esc(b.name) + '</span><div class="meta">' + esc(b.category || '') + '</div></td>' +
          '<td>' + esc(b.contact_name || '—') + '<div class="meta">' + esc(b.email) + '</div></td>' +
          '<td class="meta">' + esc(fmtDate(b.created_at)) + '</td>' +
          '<td><span class="pill ' + (done ? 'sent' : 'not') + '" data-pill>' + (done ? 'odoslaný' : 'neodoslaný') + '</span></td>' +
          '<td><button class="btn sm" data-send>' + (done ? 'Poslať znova' : 'Poslať e-mail') + '</button><div class="rowmsg" data-rowmsg></div></td>' +
          '</tr>';
      });
      $('tblWrap').innerHTML = html + '</tbody></table>';
    })
    .catch(function(err){
      $('tblWrap').innerHTML = '<p class="empty">Nepodarilo sa načítať zoznam.</p>';
      show('err', 'Chyba: ' + err.message);
    });
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('[data-send]') : null;
    if (!btn) return;
    var tr = btn.closest('tr');
    var id = tr.getAttribute('data-id');
    var token = $('tok').value.trim();
    var rowmsg = tr.querySelector('[data-rowmsg]');

    if (!token) { show('err', 'Najprv vlož ADMIN_TOKEN.'); return; }

    btn.disabled = true;
    var label = btn.textContent;
    btn.textContent = 'Posielam…';
    rowmsg.className = 'rowmsg';
    rowmsg.textContent = '';

    fetch('/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'approval_notify', id: id, token: token })
    })
    .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); })
    .then(function(res){
      btn.disabled = false;
      if (res.ok && res.body.success) {
        markSent(id);
        btn.textContent = 'Poslať znova';
        rowmsg.className = 'rowmsg ok';
        rowmsg.textContent = 'Odoslané na ' + (res.body.sentTo || '');
        var pill = tr.querySelector('[data-pill]');
        pill.className = 'pill sent'; pill.textContent = 'odoslaný';
      } else {
        btn.textContent = label;
        rowmsg.className = 'rowmsg err';
        rowmsg.textContent = res.body.error || 'Nepodarilo sa odoslať.';
      }
    })
    .catch(function(err){
      btn.disabled = false; btn.textContent = label;
      rowmsg.className = 'rowmsg err';
      rowmsg.textContent = 'Chyba siete: ' + err.message;
    });
  });

  load();
})();
</script>
</body>
</html>
