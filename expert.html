<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expert profile | ExpatBase Slovakia</title>
<meta name="description" content="Verified English-speaking professional on ExpatBase Slovakia.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A4F8A'/%3E%3Ctext x='16' y='22' font-family='Arial Black,sans-serif' font-size='16' font-weight='900' fill='white' text-anchor='middle'%3EEB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#1A4F8A;--blue-dark:#0F3360;--blue-light:#E8F1FB;--green:#2E9E6B;--green-dark:#1D7A50;--green-light:#E6F7EF;
    --gray-50:#F4F6F9;--gray-100:#DDE3EC;--gray-200:#E4EBF3;--gray-400:#8C97A8;--gray-600:#6B7A90;--gray-700:#3D4A5C;--gray-900:#1F2937;
    --radius-md:14px;--radius-lg:20px;--radius-xl:9999px;
    --head:'Urbanist',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);color:var(--gray-900);background:var(--gray-50);line-height:1.6}
  a{color:inherit}
  /* nav */
  .nav{background:#fff;border-bottom:1px solid var(--gray-100);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
  .nav-logo-text{font-family:var(--head);font-weight:700;font-size:18px;color:var(--gray-900);letter-spacing:-.3px}
  .nav-links{display:flex;gap:22px;align-items:center}
  .nav-links a{font-size:14px;color:var(--gray-700);text-decoration:none;font-weight:500}
  .nav-links a:hover{color:var(--blue)}
  @media(max-width:640px){.nav-links{display:none}}
  /* layout */
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px}
  .crumbs{font-size:13px;color:var(--gray-400);padding:18px 0}
  .crumbs a{text-decoration:none;color:var(--gray-600)}
  .crumbs a:hover{color:var(--blue)}
  /* hero */
  .cover{height:220px;border-radius:var(--radius-lg);background:linear-gradient(130deg,var(--blue),var(--green));background-size:cover;background-position:center;position:relative;box-shadow:0 10px 36px rgba(26,79,138,.18)}
  @media(max-width:640px){.cover{height:150px}}
  .idrow{display:flex;align-items:flex-end;gap:20px;margin:-54px 0 0 0;padding:0 8px 0 28px;position:relative;z-index:2}
  .avatar{width:108px;height:108px;border-radius:24px;flex:0 0 auto;border:5px solid #fff;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--head);font-weight:900;font-size:40px;object-fit:cover;box-shadow:0 8px 22px rgba(26,79,138,.22)}
  .idmeta{padding-bottom:10px}
  .idmeta h1{font-family:var(--head);font-weight:800;font-size:1.8rem;color:var(--blue-dark);letter-spacing:-.02em;line-height:1.1}
  .idmeta .cat{color:var(--gray-600);font-size:.98rem;margin-top:2px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .badge{font-family:var(--head);font-weight:700;font-size:.72rem;letter-spacing:.04em;padding:4px 11px;border-radius:999px}
  .b-en{background:var(--green-light);color:var(--green-dark)}
  .b-prem{background:linear-gradient(135deg,var(--blue-dark),#2563EB);color:#fff}
  /* grid */
  .grid{display:grid;grid-template-columns:1fr 330px;gap:26px;margin-top:34px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:26px;box-shadow:0 2px 16px rgba(26,79,138,.06);margin-bottom:22px}
  .card h2{font-family:var(--head);font-weight:800;font-size:1.05rem;color:var(--blue-dark);margin-bottom:12px}
  .card p{color:var(--gray-700);font-size:.98rem;white-space:pre-line}
  .tagline{font-size:1.1rem;color:var(--gray-700);font-weight:500;margin:14px 0 0}
  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .gallery img{width:100%;height:130px;object-fit:cover;border-radius:12px;cursor:pointer;transition:transform .2s}
  .gallery img:hover{transform:scale(1.03)}
  /* contact sidebar */
  .srow{display:flex;gap:11px;align-items:flex-start;font-size:.95rem;color:var(--gray-700);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--gray-50)}
  .srow:last-child{border-bottom:none}
  .srow .ic{color:var(--green);flex:0 0 auto;font-size:1.05rem;width:20px;text-align:center}
  a.srow:hover{color:var(--blue)}
  .cta{display:block;text-align:center;background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;font-family:var(--head);font-weight:700;text-decoration:none;padding:13px;border-radius:999px;margin-top:6px}
  .cta.secondary{background:#fff;color:var(--blue);border:1.5px solid var(--gray-200);margin-top:10px}
  .mapbox{border:0;width:100%;height:200px;border-radius:14px;margin-top:4px}
  .hours{white-space:pre-line;color:var(--gray-700);font-size:.95rem}
  /* states */
  .state{text-align:center;padding:90px 20px;color:var(--gray-400)}
  .state h2{font-family:var(--head);color:var(--blue-dark);font-size:1.3rem;margin-bottom:10px}
  .state a{color:var(--blue);text-decoration:none;font-weight:600}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(15,51,96,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:92vw;max-height:88vh;border-radius:12px}
  .lb-close{position:absolute;top:18px;right:24px;color:#fff;font-size:34px;cursor:pointer;line-height:1}
  /* footer */
  .foot{background:var(--blue-dark);color:#cdd9ea;text-align:center;padding:30px 20px;font-size:.86rem;margin-top:40px}
  .foot a{color:#fff;text-decoration:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true"><defs>
  <linearGradient id="ebGradLight" x1="0%" y1="0%" x2="90%" y2="110%"><stop offset="0%" stop-color="#1A4F8A"/><stop offset="100%" stop-color="#2E9E6B"/></linearGradient>
  <symbol id="eb-icon-light" viewBox="0 0 120 140"><path d="M 16 50 A 44 44 0 0 0 104 50 C 104 96 78 124 60 132 C 42 124 16 96 16 50 Z" fill="url(#ebGradLight)"/><text x="60" y="55" text-anchor="middle" dominant-baseline="middle" font-family="Urbanist,system-ui,sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="-2">EB</text></symbol>
</defs></svg>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <svg width="27" height="32" viewBox="0 0 120 140" aria-hidden="true"><use href="#eb-icon-light"/></svg>
    <span class="nav-logo-text">ExpatBase</span>
  </a>
  <div class="nav-links">
    <a href="index.html#categories">Find Experts</a>
    <a href="index.html#guides">Guides</a>
    <a href="index.html#about">About</a>
  </div>
</nav>

<div class="wrap">
  <div id="loading" class="state">Loading profile…</div>
  <div id="notfound" class="state" style="display:none">
    <h2>Profile not found</h2>
    <p>This listing may have been removed or isn't published yet.</p>
    <p style="margin-top:14px"><a href="index.html#categories">← Browse all experts</a></p>
  </div>
  <div id="profile" style="display:none"></div>
</div>

<div class="lb" id="lightbox"><span class="lb-close" id="lbClose">&times;</span><img id="lbImg" src="" alt=""></div>

<footer class="foot">© <span id="yr"></span> ExpatBase Slovakia · <a href="index.html">Home</a> · <a href="privacy-policy.html">Privacy</a> · <a href="terms.html">Terms</a></footer>

<script>
  var SB='https://etxqrlrqbjcbjmitnspv.supabase.co';
  var KEY='sb_publishable_i38f7jyt2HYOjUTNuOsklg_aMofdDvE';
  var _sb=supabase.createClient(SB,KEY);
  document.getElementById('yr').textContent=new Date().getFullYear();

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
  function catSlug(c){return {'Doctors':'doctors.html','Lawyers':'lawyers.html','Banks':'banks.html','Real Estate':'real-estate.html','Schools':'schools.html','Plumbers':'plumbers.html','Builders':'builders.html','Barbers':'barbers.html','Moving':'moving.html','Vets':'vets.html','Sports':'sports.html'}[c]||'index.html#categories';}

  function q(name){return new URLSearchParams(location.search).get(name);}

  function track(type,id){try{fetch(SB+'/rest/v1/events',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({business_id:id,type:type}),keepalive:true}).catch(function(){});}catch(e){}}

  function render(b){
    var prem = b.plan==='premium'||b.plan==='founding';
    var social=b.social_links||{};
    var gallery=Array.isArray(b.gallery)?b.gallery:[];
    document.title=(b.name||'Expert')+' | ExpatBase Slovakia';

    var cover = b.cover_url ? 'style="background-image:linear-gradient(130deg,rgba(26,79,138,.25),rgba(46,158,107,.25)),url(\''+esc(b.cover_url)+'\')"' : '';
    var avatar = b.logo_url ? '<img class="avatar" src="'+esc(b.logo_url)+'" alt="'+esc(b.name)+'">' : '<div class="avatar">'+esc(initials(b.name))+'</div>';

    var badges='';
    if(b.english_speaking) badges+='<span class="badge b-en">English-speaking</span>';
    if(prem) badges+='<span class="badge b-prem">Premium</span>';

    // left column
    var left='';
    if(b.tagline) left+='<p class="tagline">'+esc(b.tagline)+'</p>';
    if(b.about||b.description) left+='<div class="card"><h2>About</h2><p>'+esc(b.about||b.description)+'</p></div>';
    if(gallery.length){
      var imgs=gallery.map(function(u){return '<img src="'+esc(u)+'" alt="" loading="lazy" class="gimg">';}).join('');
      left+='<div class="card"><h2>Gallery</h2><div class="gallery">'+imgs+'</div></div>';
    }
    if(b.hours) left+='<div class="card"><h2>Opening hours</h2><div class="hours">'+esc(b.hours)+'</div></div>';
    if(b.languages&&b.languages.length) left+='<div class="card"><h2>Languages</h2><p>'+b.languages.map(esc).join(' · ')+'</p></div>';

    // right column (contact)
    var contact='';
    if(b.phone) contact+='<a class="srow" href="tel:'+esc(b.phone)+'"><span class="ic">☎</span>'+esc(b.phone)+'</a>';
    if(b.email) contact+='<a class="srow" href="mailto:'+esc(b.email)+'"><span class="ic">✉</span>'+esc(b.email)+'</a>';
    if(b.address) contact+='<div class="srow"><span class="ic">◎</span>'+esc(b.address)+(b.district?', '+esc(b.district):'')+'</div>';
    var cta='';
    if(b.website) cta+='<a class="cta" href="'+esc(b.website)+'" target="_blank" rel="noopener" data-x="web">Visit website</a>';
    if(b.phone) cta+='<a class="cta secondary" href="tel:'+esc(b.phone)+'" data-x="call">Call now</a>';
    var socrow='';
    if(social.instagram) socrow+='<a class="srow" href="'+esc(social.instagram)+'" target="_blank" rel="noopener"><span class="ic">◈</span>Instagram</a>';
    if(social.facebook) socrow+='<a class="srow" href="'+esc(social.facebook)+'" target="_blank" rel="noopener"><span class="ic">◈</span>Facebook</a>';
    var map='';
    if(b.address){var qq=encodeURIComponent((b.address||'')+', '+(b.district?b.district+', ':'')+'Bratislava, Slovakia');map='<iframe class="mapbox" loading="lazy" src="https://www.google.com/maps?q='+qq+'&output=embed"></iframe>';}

    var right='<div class="card"><h2>Contact</h2>'+(contact||'<p>No contact details yet.</p>')+socrow+cta+'</div>';
    if(map) right+='<div class="card"><h2>Location</h2>'+map+'</div>';

    var html=''+
      '<div class="crumbs"><a href="index.html">ExpatBase</a> › <a href="'+catSlug(b.category)+'">'+esc(b.category||'Experts')+'</a> › '+esc(b.name)+'</div>'+
      '<div class="cover" '+cover+'></div>'+
      '<div class="idrow">'+avatar+'<div class="idmeta"><h1>'+esc(b.name)+'</h1><div class="cat">'+esc(b.category||'')+'</div>'+(badges?'<div class="badges">'+badges+'</div>':'')+'</div></div>'+
      '<div class="grid"><div>'+left+'</div><aside>'+right+'</aside></div>';

    var p=document.getElementById('profile');
    p.innerHTML=html;
    document.getElementById('loading').style.display='none';
    p.style.display='block';

    // gallery lightbox
    var lb=document.getElementById('lightbox'),lbi=document.getElementById('lbImg');
    p.querySelectorAll('.gimg').forEach(function(img){img.addEventListener('click',function(){lbi.src=img.src;lb.classList.add('open');});});
    document.getElementById('lbClose').addEventListener('click',function(){lb.classList.remove('open');});
    lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('open');});
    // track clicks
    p.querySelectorAll('[data-x]').forEach(function(el){el.addEventListener('click',function(){track(el.getAttribute('data-x')==='web'?'website_click':'contact_click',b.id);});});
  }

  function load(){
    var id=q('id');
    if(!id){document.getElementById('loading').style.display='none';document.getElementById('notfound').style.display='block';return;}
    var url=SB+'/rest/v1/businesses?id=eq.'+encodeURIComponent(id)+'&status=eq.approved&select=*&limit=1';
    fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(rows){
        if(!rows||!rows.length){document.getElementById('loading').style.display='none';document.getElementById('notfound').style.display='block';return;}
        render(rows[0]);
        track('view',rows[0].id);
      })
      .catch(function(){document.getElementById('loading').style.display='none';document.getElementById('notfound').style.display='block';});
  }
  load();
</script>
</body>
</html>
