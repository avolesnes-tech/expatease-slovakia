  .rev-note{color:var(--gray-600);font-size:.82rem;margin:-2px 0 12px;line-height:1.5}
  .rev-report{color:var(--gray-400);font-size:.78rem;text-decoration:none;margin-left:10px}
  .rev-report:hover{color:#b91c1c;text-decoration:underline}
  .rev-gate{color:var(--gray-700);font-size:.92rem;margin-bottom:4px;line-height:1.55}
  .rev-asyou{color:var(--green-dark);font-weight:600;font-size:.88rem;margin-bottom:6px}
  .rev-check{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--gray-700);font-weight:400;margin-top:12px}
  .rev-check input{width:auto}
  .state{text-align:center;padding:90px 20px;color:var(--gray-400)}
  .state h2{font-family:var(--head);color:var(--blue-dark);font-size:1.3rem;margin-bottom:10px}

  .foot{background:var(--blue-dark);color:#cdd9ea;text-align:center;padding:30px 20px;font-size:.86rem}
  .foot a{color:#fff;text-decoration:none}
</style>

    if(b.email) contact+='<a class="srow" href="mailto:'+esc(b.email)+'" data-x="mail"><span class="ic">✉</span>'+esc(b.email)+'</a>';
    if(b.address) contact+='<div class="srow"><span class="ic">◎</span>'+esc(b.address)+(b.district?', '+esc(b.district):'')+'</div>';
    if(social.instagram) contact+='<a class="srow" href="'+esc(social.instagram)+'" target="_blank" rel="noopener"><span class="ic">◈</span>Instagram</a>';
    if(social.facebook) contact+='<a class="srow" href="'+esc(social.facebook)+'" target="_blank" rel="noopener"><span class="ic">◈</span>Facebook</a>';
    var cta='';
    if(b.website) cta+='<a class="cta" href="'+esc(b.website)+'" target="_blank" rel="noopener" data-x="web">Visit website</a>';
    if(b.phone){ var wa=String(b.phone).replace(/\D/g,''); if(wa.indexOf('00')===0){wa=wa.slice(2);} else if(wa.charAt(0)==='0'){wa='421'+wa.slice(1);} cta+='<a class="cta wa" href="https://wa.me/'+wa+'" target="_blank" rel="noopener" data-x="wa">Message on WhatsApp</a>'; }
    var map='';var ebAddr='';
    if(b.address){ebAddr=(b.address||'')+', '+(b.district?b.district+', ':'')+'Bratislava, Slovakia';var qq=encodeURIComponent(ebAddr);map='<div class="card"><h2>Location</h2><iframe id="ebMap" class="mapbox" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q='+qq+'&z=16&output=embed"></iframe><a class="srow" style="padding-top:12px" href="https://www.google.com/maps/search/?api=1&query='+qq+'" target="_blank" rel="noopener"><span class="ic">\u2197</span>Open in Google Maps</a></div>';}
    document.getElementById('colSide').innerHTML='<div class="card"><h2>Contact</h2>'+(contact||'<p>No contact details yet.</p>')+cta+'</div>'+map;
    if(ebAddr){fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=0&q='+encodeURIComponent(ebAddr)).then(function(r){return r.json();}).then(function(g){var el=document.getElementById('ebMap');if(el&&g&&g.length){el.src='https://maps.google.com/maps?q='+g[0].lat+','+g[0].lon+'&z=16&output=embed';}}).catch(function(){});}

    document.getElementById('loading').style.display='none';
    document.getElementById('profile').style.display='block';

    var lb=document.getElementById('lightbox'),lbi=document.getElementById('lbImg');
    document.querySelectorAll('.gimg').forEach(function(img){img.addEventListener('click',function(){lbi.src=img.src;lb.classList.add('open');});});
    document.getElementById('lbClose').addEventListener('click',function(){lb.classList.remove('open');});
    lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('open');});
    document.querySelectorAll('[data-x]').forEach(function(el){el.addEventListener('click',function(){var x=el.getAttribute('data-x');track(x==='web'?'website_click':'contact_click',b.id);});});

    // ---- reviews (community members only) ----
    var REVKEY='eb_rev_'+b.id;
    var rvStars=0;
    function ebMember(){ try{var m=JSON.parse(localStorage.getItem('ee_member')||'null'); if(m&&m.email) return m;}catch(_){ } return null; }
    function wireStars(){ var sp=document.getElementById('revStars'); if(!sp||sp._wired)return; sp._wired=1; sp.querySelectorAll('span').forEach(function(st){ st.addEventListener('click',function(){rvStars=+st.getAttribute('data-v');sp.querySelectorAll('span').forEach(function(x){x.classList.toggle('on',+x.getAttribute('data-v')<=rvStars);});}); }); }
    function showWrite(){ var m=ebMember(); document.getElementById('revJoin').style.display='none'; document.getElementById('revWrite').style.display='block'; document.getElementById('revAsYou').textContent='Posting as '+(m?m.name:'you'); wireStars(); }
    function alreadyReviewed(){ try{return !!localStorage.getItem(REVKEY);}catch(_){return false;} }
    var toggle=document.getElementById('revToggle');
    if(alreadyReviewed()){ toggle.textContent='You’ve reviewed this business'; toggle.disabled=true; toggle.style.opacity='.6'; toggle.style.cursor='default'; }
    toggle.addEventListener('click',function(){
      var f=document.getElementById('revForm'); f.classList.toggle('open');
      if(ebMember()){ showWrite(); } else { document.getElementById('revJoin').style.display='block'; document.getElementById('revWrite').style.display='none'; }
    });
    document.getElementById('joinBtn').addEventListener('click',function(){
      var jm=document.getElementById('joinMsg');
      var nm=document.getElementById('jName').value.trim();
      var em=document.getElementById('jEmail').value.trim();
      if(!nm){jm.className='rev-msg err';jm.textContent='Please add your name.';return;}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){jm.className='rev-msg err';jm.textContent='Please add a valid email.';return;}
      var news=document.getElementById('jNews').checked;
      try{ fetch('/functions/airtable-submit?table=Members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Name:nm,Email:em,Newsletter:news,'Submitted At':new Date().toISOString()})}).catch(function(){}); }catch(_){ }
      try{ localStorage.setItem('ee_member',JSON.stringify({name:nm,email:em,newsletter:news,joinedAt:new Date().toISOString()})); }catch(_){ }
      showWrite();
    });
    document.getElementById('revSubmit').addEventListener('click',async function(){
      var msg=document.getElementById('revMsg'); var m=ebMember();
      if(!m){document.getElementById('revWrite').style.display='none';document.getElementById('revJoin').style.display='block';return;}
      var body=document.getElementById('revText').value.trim();
      if(!rvStars){msg.className='rev-msg err';msg.textContent='Please pick a star rating.';return;}
      if(body.length<8){msg.className='rev-msg err';msg.textContent='Please write a little more about your experience.';return;}
      if(/https?:\/\//i.test(body)){msg.className='rev-msg err';msg.textContent='Please remove links from your review.';return;}
      if(alreadyReviewed()){msg.className='rev-msg err';msg.textContent='You’ve already reviewed this business.';return;}
      var btn=document.getElementById('revSubmit');btn.disabled=true;btn.textContent='Submitting…';
      try{
        var r=await _sb.from('reviews').insert({business_id:b.id,business_name:b.name,reviewer_name:m.name,reviewer_email:m.email,rating:rvStars,review_text:body});
        if(r.error) throw r.error;
        try{localStorage.setItem(REVKEY,'1');}catch(_){ }
        document.getElementById('revForm').innerHTML='<div class="rev-empty">Thank you! Your review is now live. ✅</div>';
        loadReviews(b.id);
      }catch(e){btn.disabled=false;btn.textContent='Submit review';msg.className='rev-msg err';msg.textContent='Could not submit: '+(e.message||e);}
    });
    loadReviews(b.id);
  }

  function starHtml(n){var out='';for(var i=1;i<=5;i++){out+='<span'+(i<=Math.round(n)?'':' class="off"')+'>\u2605</span>';}return '<span class="stars">'+out+'</span>';}
  function fmtDate(iso){try{var d=new Date(iso);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});}catch(e){return '';}}
  function loadReviews(id){
    fetch(SB+'/rest/v1/reviews?business_id=eq.'+encodeURIComponent(id)+'&select=rating,reviewer_name,review_text,created_at&order=created_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
      .then(function(r){return r.ok?r.json():[];})
      .then(function(list){
        list=Array.isArray(list)?list:[];
        var agg=document.getElementById('revAgg'), idAgg=document.getElementById('idAgg'), listEl=document.getElementById('revList');
        if(!list.length){
          agg.innerHTML='';
          listEl.innerHTML='<p class="rev-empty">No reviews yet \u2014 and we won\u2019t fake them. Be the first expat to share your experience.</p>';
          return;
        }
        var avg=list.reduce(function(a,b){return a+(b.rating||0);},0)/list.length;
        var avgR=Math.round(avg*10)/10;
        var summary=starHtml(avg)+'<span class="score">'+avgR.toFixed(1)+'</span><span class="cnt">('+list.length+' review'+(list.length>1?'s':'')+')</span>';
        agg.className='rev-agg';agg.innerHTML=summary;agg.style.marginTop='0';agg.style.marginBottom='8px';
        if(idAgg){idAgg.innerHTML=summary;idAgg.style.display='flex';}
        try{var _le=document.getElementById('ld-biz');if(_le){var _o=JSON.parse(_le.textContent);_o.aggregateRating={"@type":"AggregateRating","ratingValue":avgR,"reviewCount":list.length,"bestRating":5,"worstRating":1};_le.textContent=JSON.stringify(_o);}}catch(_){}
        listEl.innerHTML=list.map(function(rv){
          return '<div class="rev-item"><div class="rev-top"><span class="rev-who">'+esc(rv.reviewer_name||'Anonymous')+'</span><span class="rev-date">'+fmtDate(rv.created_at)+'</span></div>'+starHtml(rv.rating)+'<div class="rev-body">'+esc(rv.review_text||'')+'</div></div>';
        }).join('');
      })
      .catch(function(){});
  }

  function load(){
    var id=q('id');
    if(!id){document.getElementById('loading').style.display='none';document.getElementById('notfound').style.display='block';return;}
    fetch(SB+'/rest/v1/businesses?id=eq.'+encodeURIComponent(id)+'&status=eq.approved&select=*&limit=1',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(rows){
        if(!rows||!rows.length){document.getElementById('loading').style.display='none';document.getElementById('notfound').style.display='block';return;}
        render(rows[0]); track('view',rows[0].id);
      })
      .catch(function(){document.getElementById('loading').style.display='none';document.getElementById('notfound').style.display='block';});
  }
  load();
</script>
<script src="contact.js" defer></script>
</body>
</html>
